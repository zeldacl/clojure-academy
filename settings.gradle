pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://clojars.org/repo' }
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.namespace == 'net.minecraftforge') {
                useModule("net.minecraftforge:forge:${requested.version}")
            }
        }
    }
}

rootProject.name = 'clojure-academy'

include 'mcmod'
include 'forge_1_16_5'
include 'acmod'
include 'common'

project(':mcmod').projectDir = file('mcmod')
project(':forge_1_16_5').projectDir = file('forge_1_16_5')
project(':acmod').projectDir = file('acmod')
project(':common').projectDir = file('common')
