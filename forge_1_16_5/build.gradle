buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:4.+'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'dev.clojurephant.clojure'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = "1.16.5-${mod_ver}"
group = "${mod_group}.${mod_name}"
archivesBaseName = "${mod_name}"

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

minecraft {
    mappings channel: 'official', version: '1.16.5'
    
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                cljacademy {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                cljacademy {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            args '--mod', 'cljacademy', '--all', '--output', file('src/generated/resources/')
            mods {
                cljacademy {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.16.5-36.1.0'
    implementation project(':acmod')
}

sourceSets {
    main {
        java.srcDirs = ['src/main/java']
        clojure.srcDirs = ['src/main/clojure']
        resources.srcDirs = ['src/main/resources']
    }
}

clojure {
    builds.main.reflection = 'warn'
    builds.main.aotAll()
    builds.main.compiler.directLinking = true
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", '1.16.5'

    from(sourceSets.main.resources.srcDirs) {
        include 'META-INF/mods.toml'
        expand 'version':project.version, 'mcversion':'1.16.5'
    }
        
    from(sourceSets.main.resources.srcDirs) {
        exclude 'META-INF/mods.toml'
    }
}

jar {
    manifest {
        attributes([
            "Specification-Title": "${mod_name}",
            "Specification-Vendor": "${mod_group}",
            "Specification-Version": "1",
            "Implementation-Title": "${mod_name}",
            "Implementation-Version": "${version}",
            "Implementation-Vendor": "${mod_group}",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            "FMLModType": "LIBRARY"
        ])
    }
}

task createDirectoryStructure {
    doLast {
        mkdir "src/main/java"
        mkdir "src/main/clojure"
        mkdir "src/main/resources"
        mkdir "src/main/resources/META-INF"
        mkdir "src/main/resources/assets/${mod_name}"
        mkdir "run"
    }
}

build.dependsOn createDirectoryStructure