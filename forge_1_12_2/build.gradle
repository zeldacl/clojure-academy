buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://files.minecraftforge.net/maven' }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}

plugins {
    id 'clojure'
}

apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'
apply plugin: 'net.minecraftforge.gradle'

version = "1.0"
group = "cn.academy"
archivesBaseName = "academy-forge-1.12.2"

sourceCompatibility = targetCompatibility = '1.8'
compileJava {
    sourceCompatibility = targetCompatibility = '1.8'
}

minecraft {
    version = "1.12.2-14.23.5.2855"
    runDir = "run"
    mappings = "stable_39"
    
    makeObfSourceJar = false
    
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            args '--username', 'Dev'
        }
        
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
        }
    }
}

checkClojure.enabled = false

dependencies {
    implementation project(':acmod')
    implementation 'org.clojure:clojure:1.10.1'
    implementation project(':common')
    testImplementation 'org.clojure:test.check:1.1.1'
    testImplementation 'org.mockito:mockito-core:3.12.4'
}

sourceSets {
    main {
        java { srcDirs = ['src/main/java'] }
        clojure { srcDirs = ['src/main/clojure'] }
        resources { srcDirs = ['src/main/resources'] }
    }
}

clojure {
    builds.main.reflection = 'warn'
    builds.main.aotAll()
    builds.main.compiler.directLinking = true
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version':project.version, 'mcversion':project.minecraft.version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
    
    from project(':acmod').sourceSets.main.resources
    from project(':common').sourceSets.main.resources
}

jar {
    from sourceSets.main.output
    manifest {
        attributes([
            "Specification-Title": "ClojureAcademy",
            "Specification-Vendor": "clojure-academy",
            "Specification-Version": "1",
            "Implementation-Title": "ClojureAcademy",
            "Implementation-Version": project.version,
            "Implementation-Vendor" :"clojure-academy",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

task createDirectoryStructure {
    doLast {
        mkdir "src/main/java"
        mkdir "src/main/clojure"
        mkdir "src/main/resources"
        mkdir "src/main/resources/assets/${mod_name}"
        mkdir "run"
    }
}

build.dependsOn createDirectoryStructure