buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '3.+', changing: true
    }
}

plugins {
    id 'clojure'
    id 'eclipse'
}

apply plugin: 'net.minecraftforge.gradle'

version = '1.0'
group = 'cn.academy'
archivesBaseName = 'academy-forge-1.15.2'

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

minecraft {
    version = '1.15.2-31.2.0'
    runDir = 'run'
    mappings channel: 'snapshot', version: '20200514-1.15.1'
    
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            args '--username', 'Dev'
            
            mods {
                academy {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            
            mods {
                academy {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            args '--mod', 'academy', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            
            mods {
                academy {
                    source sourceSets.main
                }
            }
        }
    }
}

checkClojure.enabled = false

dependencies {
    minecraft 'net.minecraftforge:forge:1.15.2-31.2.0'
    implementation project(':acmod')
    implementation project(':common')
    implementation 'org.clojure:clojure:1.10.1'
    testImplementation 'org.clojure:test.check:1.1.1'
    testImplementation 'org.mockito:mockito-core:3.12.4'
    annotationProcessor 'org.spongepowered:mixin:0.8.2:processor'
}

sourceSets {
    main {
        java { srcDirs = ['src/main/java'] }
        clojure {
            srcDirs = ['src/main/clojure']
        }
        resources {
            srcDirs = ['src/main/resources', 'src/generated/resources']
        }
    }
}

clojure {
    builds.main.reflection = 'warn'
    builds.main.aotAll()
    builds.main.compiler.directLinking = true
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", '1.15.2'

    from(sourceSets.main.resources.srcDirs) {
        include 'META-INF/mods.toml'
        expand 'version':project.version, 'mcversion':'1.15.2'
    }
        
    from(sourceSets.main.resources.srcDirs) {
        exclude 'META-INF/mods.toml'
    }
    from project(':acmod').sourceSets.main.resources
    from project(':common').sourceSets.main.resources
}

mixin {
    add sourceSets.main, "academy.mixins.refmap.json"
}

jar {
    from sourceSets.main.output
    manifest {
        attributes([
            "Specification-Title": "ClojureAcademy",
            "Specification-Vendor": "clojure-academy",
            "Specification-Version": "1",
            "Implementation-Title": "ClojureAcademy",
            "Implementation-Version": project.version,
            "Implementation-Vendor" :"clojure-academy",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

task createDirectoryStructure {
    doLast {
        mkdir "src/main/java"
        mkdir "src/main/clojure"
        mkdir "src/main/resources"
        mkdir "src/main/resources/META-INF"
        mkdir "src/main/resources/assets/${archivesBaseName}"
        mkdir "run"
    }
}

build.dependsOn createDirectoryStructure