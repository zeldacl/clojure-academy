buildscript {
    repositories {
        maven { url uri('./repo') }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://libraries.minecraft.net/' }
        maven { url = 'https://plugins.gradle.org/m2' }
        maven {
            name = 'Clojars'
            url = 'https://repo.clojars.org/'
        }
        mavenLocal()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "dev.clojurephant:clojurephant-plugin:0.6.0"
        classpath 'net.minecraftforge.gradle:ForgeGradle:4.+'
    }
}

apply plugin: 'eclipse'
apply plugin: 'idea'
apply plugin: 'maven-publish'

group = 'cn.li.cljacademy' // http://maven.apache.org/guides/mini/guide-naming-conventions.html
version = "${mod_ver}"

// Define tasks to build specific versions with the exact requested naming
task forge__1_12_2 {
    dependsOn ':forge_1_12_2:build'
    group = 'forge'
    description = 'Builds the mod for Minecraft Forge 1.12.2'
}

task forge__1_15_2 {
    dependsOn ':forge_1_15_2:build'
    group = 'forge'
    description = 'Builds the mod for Minecraft Forge 1.15.2'
}

task forge__1_16_2 {
    dependsOn ':forge_1_16_5:build'
    group = 'forge'
    description = 'Builds the mod for Minecraft Forge 1.16.5'
}

allprojects {
    repositories {
        maven {
            url uri('./repo')
        }
        mavenCentral()
        mavenLocal()
        gradlePluginPortal()
        maven {
            name = 'Clojars'
            url = 'https://repo.clojars.org/'
        }
        maven {
            url = 'https://maven.minecraftforge.net/'
        }
        maven { url = 'https://libraries.minecraft.net/' }  // Add Minecraft libraries
    }
}

subprojects {
    apply plugin: 'java'
    
    compileJava.options.encoding = "UTF-8"
    
    dependencies {
        implementation 'org.clojure:clojure:1.12.0'
        implementation 'org.clojure:tools.logging:1.2.4'
    }
}

tasks.withType(JavaExec) {
    systemProperty 'modid', project.modid
}

project(':common') {
    apply plugin: "dev.clojurephant.clojure"
    
    checkClojure.enabled = false
    
    clojure.builds {
        main {
            reflection = 'warn'
            aotAll()
            
            compiler {
                directLinking = true // defaults to false
            }
        }
    }
    
    dependencies {
        // Common dependencies for all versions
    }
}

project(':forge_1_12_2') {
    dependencies {
        implementation 'net.minecraftforge:forge:1.12.2-14.23.5.2855'
    }
}

project(':forge_1_15_2') {
    dependencies {
        implementation 'net.minecraftforge:forge:1.15.2-31.2.0'
    }
}

project(':forge_1_16_5') {
    dependencies {
        implementation 'net.minecraftforge:forge:1.16.5-36.1.0'
    }
}
