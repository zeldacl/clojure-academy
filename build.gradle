buildscript {
    repositories {
        maven { url = 'https://files.minecraftforge.net/maven' }
        mavenCentral()
        maven {
            url "https://clojars.org/repo"
        }
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
}

repositories {
    mavenCentral()
    maven { url "https://clojars.org/repo" }
}

group = 'cn.li.cljacademy'
version = "${mod_ver}"

// Define tasks to build specific versions with the exact requested naming
task forge__1_12_2 {
    dependsOn ':forge_1_12_2:build'
    group = 'forge'
    description = 'Builds the mod for Minecraft Forge 1.12.2'
}

//task forge__1_15_2 {
//    dependsOn ':forge_1_15_2:build'
//    group = 'forge'
//    description = 'Builds the mod for Minecraft Forge 1.15.2'
//}

task forge__1_16_2 {
    dependsOn ':forge_1_16_5:build'
    group = 'forge'
    description = 'Builds the mod for Minecraft Forge 1.16.5'
}

allprojects {
    apply plugin: 'java'

    group = 'cn.academy'
    version = '1.0.0'

    repositories {
        maven { url uri('./repo') }
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://libraries.minecraft.net/' }
        maven { url = 'https://repo.clojars.org/' }
        maven { url = 'https://files.minecraftforge.net/maven' }
    }

    // Use a consistent approach across all projects - either toolchain or sourceCompatibility
    // but not both. In this case, we'll use sourceCompatibility.
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8

    // Remove Java toolchain configuration

//    clojure {
//        builds {
//            main {
//                aotNamespaces = ['*']
//            }
//        }
//    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'

    compileJava.options.encoding = "UTF-8"

    dependencies {
        implementation 'org.clojure:clojure:1.11.1'
        implementation 'org.clojure:tools.logging:1.2.4'
//        testImplementation 'org.clojure:test.check:1.1.1'
        testImplementation 'com.github.seancorfield:expectations:2.0.160'
    }

    // Remove the Java toolchain configuration here
    // java {
    //     toolchain {
    //         languageVersion = JavaLanguageVersion.of(8)
    //     }
    // }

    // Keep these consistent with allprojects section
    // The sourceCompatibility and targetCompatibility are already set in allprojects

    version = '1.0'
    group = 'cn.academy'

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }

    repositories {
        mavenLocal()
        mavenCentral()
        maven { url = 'https://repo.clojars.org/' }
    }

    test {
        useJUnitPlatform()

        testLogging {
            events "passed", "skipped", "failed"
            exceptionFormat "full"
        }
    }
}

tasks.withType(JavaExec) {
    systemProperty 'modid', project.modid
}

project(':forge_1_12_2') {
    dependencies {
        implementation project(':mcmod')
        implementation project(':acmod')
//        implementation 'net.minecraftforge:forge:1.12.2-14.23.5.2855'
    }
}

//project(':forge_1_15_2') {
//    dependencies {
//        implementation 'net.minecraftforge:forge:1.15.2-31.2.0'
//    }
//}

project(':forge_1_16_5') {
    dependencies {
        implementation project(':mcmod')
        implementation project(':acmod')
//        implementation 'net.minecraftforge:forge:1.16.5-36.1.0'
//        implementation 'org.clojure:clojure:1.12.0'
//        implementation 'org.clojure:tools.logging:1.2.4'
    }
}

project(':mcmod') {
    dependencies {
        // Core protocols project has minimal dependencies
        implementation 'org.clojure:clojure:1.12.0'
        implementation 'org.clojure:tools.logging:1.2.4'
    }
}

project(':acmod') {
    dependencies {
        implementation project(':mcmod')
        implementation 'org.clojure:clojure:1.12.0'
        implementation 'org.clojure:tools.logging:1.2.4'
    }
}

