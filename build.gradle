// Main project configuration
group = 'cn.li.cljacademy'
version = '1.0.0'

// Replace the duplicate clean task with a custom one if needed
// or simply remove it since the default clean task will handle most cases
task cleanAll(type: Delete) {
    delete rootProject.buildDir
    // Add any additional directories to clean if needed
}

// Ensure proper build order
evaluationDependsOn(':mcmod')
evaluationDependsOn(':acmod')
evaluationDependsOn(':forge_1_16_5')

dependencies {
    // Root project dependencies if needed
    // Don't include Forge here as it's specific to subprojects
}
