plugins {
    id 'dev.clojurephant.clojure' version '0.6.0' apply false
}

buildscript {
    repositories {
        maven { url = 'https://files.minecraftforge.net/maven' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+'
    }
}

apply plugin: 'eclipse'
apply plugin: 'idea'
apply plugin: 'maven-publish'

group = 'cn.li.cljacademy' // http://maven.apache.org/guides/mini/guide-naming-conventions.html
version = "${mod_ver}"

// Define tasks to build specific versions with the exact requested naming
task forge__1_12_2 {
    dependsOn ':forge_1_12_2:build'
    group = 'forge'
    description = 'Builds the mod for Minecraft Forge 1.12.2'
}

task forge__1_15_2 {
    dependsOn ':forge_1_15_2:build'
    group = 'forge'
    description = 'Builds the mod for Minecraft Forge 1.15.2'
}

task forge__1_16_2 {
    dependsOn ':forge_1_16_5:build'
    group = 'forge'
    description = 'Builds the mod for Minecraft Forge 1.16.5'
}

allprojects {
    apply plugin: 'java'
    
    group = 'cn.academy'
    version = '1.0.0'

    repositories {
        maven { url uri('./repo') }
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://libraries.minecraft.net/' }
        maven { url = 'https://repo.clojars.org/' }
        maven { url = 'https://files.minecraftforge.net/maven' }
    }
    
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'clojure'
    apply plugin: 'maven-publish'
    
    compileJava.options.encoding = "UTF-8"
    
    dependencies {
        implementation 'org.clojure:clojure:1.11.1'
        implementation 'org.clojure:tools.logging:1.2.4'
        testImplementation 'org.clojure:test.check:1.1.1'
        testImplementation 'com.github.seancorfield:expectations:2.0.160'
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(8)
        }
    }
    version = '1.0'
    group = 'cn.academy'

    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }

    repositories {
        mavenLocal()
        mavenCentral()
        maven { url = 'https://repo.clojars.org/' }
    }

    test {
        useJUnitPlatform()
        
        testLogging {
            events "passed", "skipped", "failed"
            exceptionFormat "full"
        }
    }
}

tasks.withType(JavaExec) {
    systemProperty 'modid', project.modid
}

project(':common') {
    apply plugin: "dev.clojurephant.clojure"
    
    checkClojure.enabled = false
    
    clojure.builds {
        main {
            reflection = 'warn'
            aotAll()
            
            compiler {
                directLinking = true // defaults to false
            }
        }
    }
    
    dependencies {
        // Common dependencies for all versions
    }
}

project(':forge_1_12_2') {
    dependencies {
        implementation 'net.minecraftforge:forge:1.12.2-14.23.5.2855'
    }
}

project(':forge_1_15_2') {
    dependencies {
        implementation 'net.minecraftforge:forge:1.15.2-31.2.0'
    }
}

project(':forge_1_16_5') {
    dependencies {
        implementation project(':mcmod')
        implementation project(':acmod')
        implementation 'net.minecraftforge:forge:1.16.5-36.1.0'
        implementation 'org.clojure:clojure:1.12.0'
        implementation 'org.clojure:tools.logging:1.2.4'
    }
}

project(':mcmod') {
    dependencies {
        // Core protocols project has minimal dependencies
        implementation 'org.clojure:clojure:1.12.0'
        implementation 'org.clojure:tools.logging:1.2.4'
    }
}

project(':acmod') {
    dependencies {
        implementation project(':mcmod')
        implementation 'org.clojure:clojure:1.12.0'
        implementation 'org.clojure:tools.logging:1.2.4'
    }
}

// Common build configuration
configure(subprojects) { project ->
    apply plugin: "dev.clojurephant.clojure"
    
    clojure.builds {
        main {
            reflection = 'warn'
            aotAll()
            compiler {
                directLinking = true
            }
        }
    }
}

// Main project configuration
group = 'cn.li.cljacademy'
version = '1.0.0'

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Ensure proper build order
evaluationDependsOn(':mcmod')
evaluationDependsOn(':acmod')
evaluationDependsOn(':forge_1_16_5')
